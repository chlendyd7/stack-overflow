<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Get User Data</title>
    <script type="module">
        import { db, ref, onValue } from './firebaseConfig.js';

        // 데이터 읽기 함수
        window.getUserData = function (userId) {
            const userRef = ref(db, 'chat/' + userId);
            onValue(userRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('output').innerText = JSON.stringify(data, null, 2);
                    document.getElementById('name').value = data.username;
                    document.getElementById('email').value = data.email;
                    document.getElementById('imageUrl').value = data.profile_picture;
                    console.log('User data updated:', data);
                    console.log('OnValue:', onValue)
                } else {
                    console.log('No data available');
                }
            });
        }
    </script>
</head>

<body>
    <h1>Firebase Get User Data Example</h1>
    <div>
        <textarea name="" id="" cols="30" rows="10"></textarea>
        <label for="userId">User ID:</label>
        <input type="text" id="userId"><br>
        <label for="name">Name:</label>
        <input type="text" id="name"><br>
        <label for="email">Email:</label>
        <input type="text" id="email"><br>
        <label for="imageUrl">Image URL:</label>
        <input type="text" id="imageUrl"><br>
        <button onclick="getUserData(document.getElementById('userId').value)">서버 열기</button>
    </div>
    <pre id="output" style="border: 1px solid #ccc; padding: 50px; margin-top: 20px;"></pre>
</body>

</html>
